# What runs on every push and pull request. See "CI" in docs/testing.md for what
# it covers and what it leaves out.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A pull request from a branch of this repository is already tested by the
    # push of that branch. Only pull requests from forks run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-24.04
          - name: darwin/arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show the machine
        run: (lscpu | grep "Model name") || sysctl -n machdep.cpu.brand_string
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The bundle tests, the router test and the dev test run Vite on Node, and show skip without
      # the packages of these folders.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            internal/bundle/testdata/pnpm-lock.yaml
            test/apps/pages/pnpm-lock.yaml
            js/host/pnpm-lock.yaml
      - name: Install the packages of the Node tests
        run: |
          for dir in internal/bundle/testdata test/apps/pages js/host; do
            (cd "$dir" && pnpm install --frozen-lockfile)
          done

      - name: Vet
        run: go vet ./...
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...
      # test/compare plays rounds of the browse run against fake servers on the
      # clock and takes about 6 minutes, internal/bundle runs Vite on Node and
      # takes 6 to 9: too close to the 10 minutes go test gives a package by
      # default. See "CI" in docs/testing.md.
      - name: Test
        run: go test -count=1 -timeout 20m ./...
      - name: Docs have a summary
        run: scripts/docs-list.sh --check
      # A binary built in the checkout and committed by mistake goes into every
      # module download.
      - name: No binaries or files over 1 MB
        run: scripts/check-files.sh

  e2e:
    # The end-to-end tests build the CLI and the apps under test/apps and
    # examples/shop with Node and pnpm, then start the outputs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: e2e (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            test/apps/*/pnpm-lock.yaml
            examples/shop/pnpm-lock.yaml

      # Every app with npm packages, so that a new app under test/apps is
      # installed without a change here.
      - name: Install the packages of the apps
        run: |
          for manifest in test/apps/*/package.json examples/shop/package.json; do
            (cd "$(dirname "$manifest")" && pnpm install --frozen-lockfile)
          done
      - name: Test
        run: go test -count=1 ./test/e2e/ -v -timeout 25m
        env:
          TIFA_E2E: "1"

  compare-apps:
    # The Next.js and TanStack Start apps of test/compare copy the shop's pages, so a rename in the
    # shop breaks them. Nothing else builds them, and a benchmark run found the last break days late.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: compare apps (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            examples/shop/pnpm-lock.yaml
            test/compare/*/pnpm-lock.yaml

      # Builds the shop, copies its pages into both apps, installs their packages, builds them and
      # type checks them. This is the prepare step of the comparison, without any measuring.
      - name: Build the comparison apps
        run: go run ./test/compare/cmd/compare build

  windows:
    # A fast subset: everything compiles, a few packages that pass on Windows, the front end build
    # of a new app and of the shop, started and asked for a page, tifa dev on a new app and its
    # end-to-end tests, the deploy tests, and a new app cloned with CRLF line ends. The full suite
    # does not run on Windows yet. See "CI" in docs/testing.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            examples/shop/pnpm-lock.yaml
            test/apps/*/pnpm-lock.yaml

      # test/compare runs the browse benchmark, which is Unix only (Rlimit, Getrusage, flock). Its files
      # are bound to the method hash of a result, so they are left out here and not changed.
      - name: Vet
        run: go vet $(go list ./... | grep -v /test/compare)
      - name: Build without cgo
        run: CGO_ENABLED=0 go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v /test/compare)
      # These packages and tests pass on Windows. Add one when it does.
      - name: Test
        run: >
          go test -count=1 -timeout 10m
          . ./internal/realpath/ ./internal/analyze/ ./internal/config/ ./internal/core/
          ./internal/foreign/ ./internal/langs/ ./internal/symwalk/ ./internal/content/...
          ./internal/deverrors/
        # The files of one package are tested together, which Windows runs in a minute.
      - name: Test the build path
        run: go test -count=1 -timeout 10m -run 'FileTypes|Executable|TargetSystem|Output' ./server/ ./cmd/tifa/
      - name: Build a new app and the shop, and ask the programs for a page
        run: scripts/smoke-build.sh
      # The app of tifa dev, its stop and its job object, the lock, the stop request and the
      # commands of --background.
      - name: Test tifa dev
        run: |
          go test -count=1 -timeout 10m ./internal/devserver/
          go test -count=1 -timeout 5m -run 'Lifeline' ./server/
          go test -count=1 -timeout 10m -run 'Dev|Status|Stop|Logs|Lock|Errors|MoveAside|Background' ./cmd/tifa/
      - name: Run tifa dev on a new app, edit it, stop it and kill it
        run: scripts/smoke-dev.sh
      # What tifa deploy runs on this machine: the arguments and the input of ssh, the files it
      # reads. The tests that run the server scripts need sh and skip here.
      - name: Test tifa deploy
        run: go test -count=1 -v -timeout 10m -run 'Deploy|Setup' ./cmd/tifa/
      # The end-to-end tests of tifa dev, on copies of the apps under test/apps that have npm
      # packages. The ones that test Unix things are in _unix_test.go files and do not build here.
      - name: Install the packages of the apps that the tifa dev tests use
        run: |
          for app in pages content tailwind i18n; do
            (cd "test/apps/$app" && pnpm install --frozen-lockfile)
          done
      - name: Run the end-to-end tests of tifa dev
        run: go test -count=1 -v -timeout 20m -run '^TestDev' ./test/e2e/
        env:
          TIFA_E2E: "1"
      # Last, since it changes the git config of the runner as git on a Windows desktop has it.
      - name: Build a new app from a clone made with core.autocrlf true
        run: |
          git config --global core.autocrlf true
          scripts/smoke-crlf.sh
