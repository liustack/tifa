# What runs on every push and pull request. See "CI" in docs/testing.md for what
# it covers and what it leaves out.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A pull request from a branch of this repository is already tested by the
    # push of that branch. Only pull requests from forks run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-24.04
          - name: darwin/arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show the machine
        run: (lscpu | grep "Model name") || sysctl -n machdep.cpu.brand_string
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The bundle tests, the router test and the dev test run Vite on Node, and show skip without
      # the packages of these folders.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            internal/bundle/testdata/pnpm-lock.yaml
            test/apps/pages/pnpm-lock.yaml
            js/host/pnpm-lock.yaml
      - name: Install the packages of the Node tests
        run: |
          for dir in internal/bundle/testdata test/apps/pages js/host; do
            (cd "$dir" && pnpm install --frozen-lockfile)
          done

      - name: Vet
        run: go vet ./...
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...
      # test/compare plays rounds of the browse run against fake servers on the
      # clock and takes about 6 minutes, internal/bundle runs Vite on Node and
      # takes 6 to 9: too close to the 10 minutes go test gives a package by
      # default. See "CI" in docs/testing.md.
      - name: Test
        run: go test -count=1 -timeout 20m ./...
      - name: Docs have a summary
        run: scripts/docs-list.sh --check
      # A binary built in the checkout and committed by mistake goes into every
      # module download.
      - name: No binaries or files over 1 MB
        run: scripts/check-files.sh

  e2e:
    # The end-to-end tests build the CLI and the apps under test/apps and
    # examples/shop with Node and pnpm, then start the outputs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: e2e (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            test/apps/*/pnpm-lock.yaml
            examples/shop/pnpm-lock.yaml

      # Every app with npm packages, so that a new app under test/apps is
      # installed without a change here.
      - name: Install the packages of the apps
        run: |
          for manifest in test/apps/*/package.json examples/shop/package.json; do
            (cd "$(dirname "$manifest")" && pnpm install --frozen-lockfile)
          done
      - name: Test
        run: go test -count=1 ./test/e2e/ -v -timeout 25m
        env:
          TIFA_E2E: "1"

  compare-apps:
    # The Next.js and TanStack Start apps of test/compare copy the shop's pages, so a rename in the
    # shop breaks them. Nothing else builds them, and a benchmark run found the last break days late.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: compare apps (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            examples/shop/pnpm-lock.yaml
            test/compare/*/pnpm-lock.yaml

      # Builds the shop, copies its pages into both apps, installs their packages, builds them and
      # type checks them. This is the prepare step of the comparison, without any measuring.
      - name: Build the comparison apps
        run: go run ./test/compare/cmd/compare build

  windows-probe:
    name: windows probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            internal/bundle/testdata/pnpm-lock.yaml
            test/apps/pages/pnpm-lock.yaml
            js/host/pnpm-lock.yaml
            examples/shop/pnpm-lock.yaml
      - name: Machine and tools
        continue-on-error: true
        run: |
          systeminfo | head -4 || true
          go version; node --version; pnpm --version; git --version; bash --version | head -1
          where ssh || true
          ssh -V || true
          curl --version | head -1
          powershell -Command "Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH*'" || true
      - name: Install the packages of the Node tests
        continue-on-error: true
        run: |
          for dir in internal/bundle/testdata test/apps/pages js/host; do
            (cd "$dir" && pnpm install --frozen-lockfile)
          done
      - name: Vet
        continue-on-error: true
        run: go vet ./... 2>&1 | tee vet.log
      - name: Build
        continue-on-error: true
        run: CGO_ENABLED=0 go build ./... 2>&1 | tee build.log
      - name: Test
        continue-on-error: true
        run: go test -count=1 -timeout 30m -json ./... > test.json 2> test.err; echo exit=$?; tail -5 test.err
      - name: Smoke test of the command line
        continue-on-error: true
        run: |
          set +e
          W="$(pwd)"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/smoke"
          go build -o "$RUNNER_TEMP/bin/tifa.exe" ./cmd/tifa 2>&1 || exit 1
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd "$RUNNER_TEMP/smoke"
          echo "== new"; tifa new smokeapp; echo "exit=$?"
          cd smokeapp
          go mod edit -replace "github.com/liustack/tifa=$W"
          echo "== tidy"; go mod tidy 2>&1 | tail -20; echo "exit=${PIPESTATUS[0]}"
          echo "== pnpm install"; pnpm install 2>&1 | tail -20; echo "exit=${PIPESTATUS[0]}"
          echo "== check"; go tool tifa check 2>&1 | tail -40; echo "exit=${PIPESTATUS[0]}"
          echo "== build"; go tool tifa build 2>&1 | tail -40; echo "exit=${PIPESTATUS[0]}"
          ls -la; ls -la .tifa 2>/dev/null | head -30
          echo "== run the built program"
          EXE="$(ls *.exe 2>/dev/null | head -1)"; echo "exe=$EXE"; ls .tifa/ 2>/dev/null
          if [ -n "$EXE" ]; then
            ./"$EXE" > run.log 2>&1 &
            sleep 8
            echo "-- curl /"; curl -s -i --max-time 10 http://127.0.0.1:9527/ | head -20
            powershell -Command "(Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9527/).StatusCode"
            taskkill //F //IM "$EXE" || true
            echo "-- run.log"; cat run.log | tail -30
          fi
          echo "== dev --help"; go tool tifa dev --help 2>&1 | head -40
          echo "== dev"; (timeout 30 go tool tifa dev 2>&1 | tail -40); echo "exit=$?"
          echo "== dev --background"; go tool tifa dev --background 2>&1 | tail -20
          echo "== dev stop/status/logs"; go tool tifa dev stop 2>&1 | tail -5
      - name: Smoke test in PowerShell
        continue-on-error: true
        shell: pwsh
        run: |
          $tifa = Join-Path $env:RUNNER_TEMP 'bin\tifa.exe'
          & $tifa dev --help
          & $tifa version
          & $tifa docs 2>&1 | Select-Object -First 5
      - name: E2E
        continue-on-error: true
        env:
          TIFA_E2E: "1"
        run: |
          for manifest in test/apps/*/package.json examples/shop/package.json; do
            (cd "$(dirname "$manifest")" && pnpm install --frozen-lockfile) || echo "pnpm install failed in $manifest"
          done
          go test -count=1 -timeout 40m -json ./test/e2e/ > e2e.json 2> e2e.err; echo exit=$?; tail -5 e2e.err
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-probe-${{ matrix.os }}
          path: |
            vet.log
            build.log
            test.json
            test.err
            e2e.json
            e2e.err
